# MythCards relay server (LLD-network-match.md 4.4). It stores and orders each match's
# action log and never runs game rules. One Durable Object per room, SQLite storage
# (available on the Workers Free plan).
name = "mythcards-server"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
